<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1150" />
    <script>
      // aplica o tema antes do React renderizar (evita piscar)
      (function () {
        var t = null
        try { t = localStorage.getItem('gamora:theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light' // padrão: tema claro
        document.documentElement.dataset.theme = t
      })()
    </script>
    <title>Gamora — Suas finanças, em família</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
